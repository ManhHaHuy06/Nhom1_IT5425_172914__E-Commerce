services:
  olist-data-source:
    build: .
    container_name: olist-data-source
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /app/olist_augmented_data
      SIMULATION_DIR: /app/simulation
    volumes:
      # Keep simulated versions/change logs after container recreation.
      - ./simulation:/app/simulation
      # Serve augmented CSVs (hot-reload without image rebuild).
      - ./olist_augmented_data:/app/olist_augmented_data:ro
    restart: unless-stopped
