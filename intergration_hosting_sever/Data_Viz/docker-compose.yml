name: olist

x-airflow-common: &airflow-common
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_PG_PASSWORD}@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__WEBSERVER__WORKERS: "2"
    PYTHONPATH: /opt/airflow/include
    AIRFLOW_VAR_OLTP_URL: mysql+pymysql://${OLTP_ETL_USER}:${OLTP_ETL_PASSWORD}@oltp-mysql:3306/${OLTP_DATABASE}
    AIRFLOW_VAR_MINIO_ENDPOINT: http://minio:9000
    AIRFLOW_VAR_MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
    AIRFLOW_VAR_MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    AIRFLOW_VAR_MINIO_BUCKET: ${MINIO_BUCKET}
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/include:/opt/airflow/include
    - airflow_logs:/opt/airflow/logs
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  oltp-mysql:
    image: mysql:8.0
    container_name: oltp-mysql
    command: >
      --default-time-zone=+00:00
      --log-bin=mysql-bin --binlog-format=ROW --server-id=1
      --local-infile=1
      --character-set-server=utf8mb4
    environment:
      MYSQL_ROOT_PASSWORD: ${OLTP_ROOT_PASSWORD}
      MYSQL_DATABASE: ${OLTP_DATABASE}
      OLTP_SIM_USER: ${OLTP_SIM_USER}
      OLTP_SIM_PASSWORD: ${OLTP_SIM_PASSWORD}
      OLTP_ETL_USER: ${OLTP_ETL_USER}
      OLTP_ETL_PASSWORD: ${OLTP_ETL_PASSWORD}
    ports:
      - "${OLTP_PORT:-3307}:3306"
    volumes:
      - oltp_data:/var/lib/mysql
      - ./source/sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./source/sql/02_users.sh:/docker-entrypoint-initdb.d/02_users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    build: ./infra/minio
    image: olist-minio:local
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: olist-minio:local
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - ./infra/minio-init.sh:/minio-init.sh:ro
    entrypoint: ["/bin/sh", "/minio-init.sh"]
    restart: "no"

  simulator:
    build: ./source
    image: olist-source:local
    profiles: ["sim"]
    env_file: .env
    environment:
      OLTP_HOST: oltp-mysql
      OLTP_PORT: "3306"
      DATA_DIR: /data
    depends_on:
      oltp-mysql:
        condition: service_healthy
    volumes:
      - ./Data:/data:ro
      - ./source:/app

  airflow-postgres:
    image: postgres:15
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_PG_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 20

  airflow-init:
    build: ./airflow
    image: olist-airflow:local
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username "${AIRFLOW_ADMIN_USER}" --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Admin --lastname User --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    image: olist-airflow:local
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    image: olist-airflow:local
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow_pg:
  airflow_logs:
  oltp_data:
  minio_data:
