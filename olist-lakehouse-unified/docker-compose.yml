# Kien truc Data Lakehouse cho bo du lieu Olist E-Commerce:
# - MinIO         : Object Storage (bucket handoff = CSV crawler, lakehouse = Iceberg)
# - PostgreSQL    : Backend luu metadata Iceberg Catalog
# - Iceberg REST  : REST Catalog cho Iceberg
# - Spark         : Engine xu ly ETL batch (CSV bronze handoff -> Iceberg Bronze -> Silver -> Gold)
# - Trino         : Query Engine - truy van SQL truc tiep tren Iceberg tables
# - ClickHouse    : Serving OLAP cho dashboard / BI
#
# Web UIs:
#   MinIO Console : http://localhost:9001
#   Spark UI      : http://localhost:8084
#   Trino UI      : http://localhost:8085
#   Iceberg REST  : http://localhost:8181
#   ClickHouse    : http://localhost:8123
#
# Pipeline batch: crawler ghi s3://handoff/bronze truoc, roi run_lakehouse.ps1


name: olist-lakehouse-unified

x-airflow-common: &airflow-common
  build: ./airflow
  image: olist-lakehouse-airflow:local
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_PG_PASSWORD}@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "2"
    AIRFLOW__WEBSERVER__WORKERS: "2"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/airflow/include
    AIRFLOW_VAR_OLTP_HOST: oltp-mysql
    AIRFLOW_VAR_OLTP_PORT: "3306"
    AIRFLOW_VAR_OLTP_DATABASE: ${OLTP_DATABASE:-shop}
    AIRFLOW_VAR_OLTP_ETL_USER: ${OLTP_ETL_USER}
    AIRFLOW_VAR_OLTP_ETL_PASSWORD: ${OLTP_ETL_PASSWORD}
    AIRFLOW_VAR_MINIO_ENDPOINT: http://minio:9000
    AIRFLOW_VAR_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
    AIRFLOW_VAR_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    AIRFLOW_VAR_MINIO_BUCKET: lakehouse
    AIRFLOW_VAR_SPARK_RUNNER_URL: http://spark-job-runner:8090
    AIRFLOW_VAR_SPARK_RUNNER_TOKEN: ${SPARK_RUNNER_TOKEN}
    AIRFLOW_VAR_CLICKHOUSE_HTTP_URL: http://clickhouse:8123
    AIRFLOW_VAR_CLICKHOUSE_USER: default
    AIRFLOW_VAR_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./airflow/include:/opt/airflow/include:ro
    - airflow_logs:/opt/airflow/logs
    - airflow_work:/opt/airflow/work
  depends_on:
    airflow-postgres:
      condition: service_healthy
    oltp-seed:
      condition: service_completed_successfully
    minio:
      condition: service_healthy
    iceberg-rest:
      condition: service_healthy
    clickhouse:
      condition: service_healthy
    spark-job-runner:
      condition: service_healthy
    lakehouse-ddl-init:
      condition: service_completed_successfully
    clickhouse-init:
      condition: service_completed_successfully
  restart: unless-stopped
  networks: [olist-network]


services:
  lakehouse-ddl-init:
    image: olist-lakehouse-spark-runner:local
    container_name: olist-lakehouse-ddl-init
    entrypoint: ["python3", "-c"]
    command:
      - |
        import json, os, time, urllib.request
        req = urllib.request.Request(
          "http://spark-job-runner:8090/run",
          data=json.dumps({"stage":"ddl"}).encode(),
          headers={"Content-Type":"application/json","X-Runner-Token":os.environ["SPARK_RUNNER_TOKEN"]},
          method="POST")
        with urllib.request.urlopen(req, timeout=21600) as response:
          print(response.read().decode())
    environment:
      SPARK_RUNNER_TOKEN: ${SPARK_RUNNER_TOKEN}
    depends_on:
      spark-job-runner:
        condition: service_healthy
    restart: "no"
    networks: [olist-network]



  catalog-postgres:
    image: postgres:15-alpine
    container_name: olist-catalog-postgres
    hostname: catalog-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: iceberg_catalog
    ports:
      - "${EXTERNAL_POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d iceberg_catalog"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - olist-network

  # Official minio/minio + minio/mc were removed from Docker Hub (2025/2026).
  # soldevelo/minio ships server + mc client compatible with this stack.
  minio:
    image: soldevelo/minio:2026.7.17
    container_name: olist-minio
    hostname: minio
    user: "0:0"
    ports:
      - "${EXTERNAL_MINIO_API_PORT}:9000"
      - "${EXTERNAL_MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - olist-network

  minio-init:
    image: soldevelo/minio:2026.7.17
    container_name: olist-minio-init
    user: "0:0"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      PATH: /opt/bitnami/minio-client/bin:/usr/bin:/bin
    volumes:
      - ./infrastructure/minio/init-buckets-safe.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    networks:
      - olist-network


  iceberg-rest:
    build:
      context: ./infrastructure/iceberg-rest
      dockerfile: Dockerfile
    container_name: olist-iceberg-rest
    hostname: iceberg-rest
    ports:
      - "${EXTERNAL_ICEBERG_REST_PORT}:8181"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3a://lakehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://catalog-postgres:5432/iceberg_catalog
      CATALOG_JDBC_USER: ${POSTGRES_USER}
      CATALOG_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      minio-init:
        condition: service_completed_successfully
      catalog-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8181'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - olist-network

  spark-master:
    build:
      context: ./infrastructure/spark
      dockerfile: Dockerfile
    container_name: olist-spark-master
    hostname: spark-master
    ports:
      - "${EXTERNAL_SPARK_UI_PORT}:8080"
      - "7077:7077"
    environment:
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      PYTHONPATH: /opt/spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    volumes:
      - ./olist_pipeline.py:/opt/spark/olist_pipeline.py:ro
      - ./common:/opt/spark/common:ro
      - ./layers:/opt/spark/layers:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully
      iceberg-rest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - olist-network

  spark-worker:
    build:
      context: ./infrastructure/spark
      dockerfile: Dockerfile
    container_name: olist-spark-worker
    hostname: spark-worker
    environment:
      SPARK_WORKER_CORES: ${SPARK_WORKER_CORES}
      SPARK_WORKER_MEMORY: ${SPARK_WORKER_MEMORY}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      PYTHONPATH: /opt/spark
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    volumes:
      - ./olist_pipeline.py:/opt/spark/olist_pipeline.py:ro
      - ./common:/opt/spark/common:ro
      - ./layers:/opt/spark/layers:ro
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - olist-network

  trino:
    image: trinodb/trino:440
    container_name: olist-trino
    hostname: trino
    ports:
      - "${EXTERNAL_TRINO_PORT}:8080"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    volumes:
      - ./infrastructure/trino/config.properties:/etc/trino/config.properties:ro
      - ./infrastructure/trino/jvm.config:/etc/trino/jvm.config:ro
      - ./infrastructure/trino/node.properties:/etc/trino/node.properties:ro
      - ./infrastructure/trino/catalog:/etc/trino/catalog:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully
      iceberg-rest:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - olist-network

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: olist-clickhouse
    hostname: clickhouse
    ports:
      - "${EXTERNAL_CLICKHOUSE_HTTP_PORT}:8123"
      - "${EXTERNAL_CLICKHOUSE_NATIVE_PORT}:9000"
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./infrastructure/clickhouse/config.xml:/etc/clickhouse-server/config.d/custom.xml:ro
      - ./layers/clickhouse/load_gold.sql:/opt/olist/load_gold.sql:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - olist-network

  clickhouse-init:
    image: clickhouse/clickhouse-server:24.3
    container_name: olist-clickhouse-init
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./layers/clickhouse/init_gold.sql:/init_gold.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        clickhouse-client --host clickhouse --password "$$CLICKHOUSE_PASSWORD" --multiquery < /init_gold.sql
        echo "ClickHouse gold schema ready"
    networks:
      - olist-network


  # --------------------------------------------------
  # Simulated Olist shop OLTP (source of changing data)
  # --------------------------------------------------
  oltp-mysql:
    image: mysql:8.0
    container_name: olist-integration-mysql
    command: >
      --default-time-zone=+00:00
      --log-bin=mysql-bin --binlog-format=ROW --server-id=1
      --local-infile=1 --character-set-server=utf8mb4
    environment:
      MYSQL_ROOT_PASSWORD: ${OLTP_ROOT_PASSWORD}
      MYSQL_DATABASE: ${OLTP_DATABASE:-shop}
      OLTP_SIM_USER: ${OLTP_SIM_USER}
      OLTP_SIM_PASSWORD: ${OLTP_SIM_PASSWORD}
      OLTP_ETL_USER: ${OLTP_ETL_USER}
      OLTP_ETL_PASSWORD: ${OLTP_ETL_PASSWORD}
    ports:
      - "${OLTP_PORT:-3307}:3306"
    volumes:
      - oltp_data:/var/lib/mysql
      - ./source/sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./source/sql/02_users.sh:/docker-entrypoint-initdb.d/02_users.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [olist-network]

  oltp-seed:
    build: ./source
    image: olist-shop-simulator:local
    container_name: olist-shop-seed
    command: ["python", "seed.py"]
    environment: &oltp-env
      OLTP_HOST: oltp-mysql
      OLTP_PORT: "3306"
      OLTP_DATABASE: ${OLTP_DATABASE:-shop}
      OLTP_SIM_USER: ${OLTP_SIM_USER}
      OLTP_SIM_PASSWORD: ${OLTP_SIM_PASSWORD}
      SIM_SEED: ${SIM_SEED:-42}
      SIM_INITIAL_ORDERS: ${SIM_INITIAL_ORDERS:-12000}
    depends_on:
      oltp-mysql:
        condition: service_healthy
    restart: "no"
    networks: [olist-network]

  simulator:
    build: ./source
    image: olist-shop-simulator:local
    container_name: olist-shop-simulator
    command: ["python", "simulator.py", "run"]
    environment:
      <<: *oltp-env
      SIM_SPEED: ${SIM_SPEED:-60}
      SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-30}
      SIM_ORDERS_PER_TICK: ${SIM_ORDERS_PER_TICK:-2}
    depends_on:
      oltp-seed:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [olist-network]

  # --------------------------------------------------
  # Airflow orchestration; uses existing Lakehouse services
  # --------------------------------------------------
  airflow-postgres:
    image: postgres:15-alpine
    container_name: olist-integration-airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_PG_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow", "-d", "airflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [olist-network]

  spark-job-runner:
    build:
      context: ./spark_runner
      dockerfile: Dockerfile
      args:
        SPARK_VERSION: 3.5.3
        ICEBERG_VERSION: 1.5.0
    image: olist-lakehouse-spark-runner:local
    container_name: olist-lakehouse-spark-runner
    environment:
      SPARK_RUNNER_TOKEN: ${SPARK_RUNNER_TOKEN}
      SPARK_MASTER_URL: spark://spark-master:7077
      LAKEHOUSE_ICEBERG_REST_URI: http://iceberg-rest:8181
      LAKEHOUSE_MINIO_ENDPOINT: http://minio:9000
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-16}
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-2g}
      SPARK_EXECUTOR_MEMORY: ${SPARK_EXECUTOR_MEMORY:-1g}
      SPARK_EXECUTOR_CORES: ${SPARK_EXECUTOR_CORES:-2}
      SPARK_JOB_TIMEOUT_SECONDS: ${SPARK_JOB_TIMEOUT_SECONDS:-21600}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      PYTHONPATH: /opt/olist
    volumes:
      - ./olist_pipeline.py:/opt/olist/olist_pipeline.py:ro
      - ./common:/opt/olist/common:ro
      - ./layers:/opt/olist/layers:ro
      - ./spark_runner:/opt/olist/spark_runner:ro
    ports:
      - "127.0.0.1:${SPARK_RUNNER_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8090/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [olist-network]

  airflow-init:
    <<: *airflow-common
    container_name: olist-integration-airflow-init
    command: >
      bash -c "airflow db migrate &&
      (airflow users create --username '${AIRFLOW_ADMIN_USER:-admin}' --password '${AIRFLOW_ADMIN_PASSWORD}'
      --firstname Admin --lastname User --role Admin --email admin@example.com || true)"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: olist-integration-airflow-webserver
    command: webserver
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: olist-integration-airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    image: olist-lakehouse-dashboard:local
    container_name: olist-lakehouse-dashboard
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: olist_gold
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [olist-network]

networks:
  olist-network:
    name: olist-lakehouse-network
    driver: bridge

volumes:
  oltp_data:
    name: olist-integration_oltp_data
  airflow_pg:
    name: olist-lakehouse-unified_airflow_pg
  airflow_logs:
    name: olist-lakehouse-unified_airflow_logs
  airflow_work:
    name: olist-lakehouse-unified_airflow_work
  postgres-data:
    name: olist-lakehouse-postgres-data
  minio-data:
    name: olist-lakehouse-minio-data
  clickhouse-data:
    name: olist-lakehouse-clickhouse-data
