services:
  spark-etl:
    build: .
    container_name: olist-spark-etl

    environment:
      MINIO_ENDPOINT: "host.docker.internal:9000"
      MINIO_ACCESS_KEY: "admin"
      MINIO_SECRET_KEY: "minioadmin"
      MINIO_BUCKET: "olist"
      MINIO_SECURE: "false"

      INPUT_PREFIX: "raw"
      OUTPUT_PREFIX: "curated"
      QUARANTINE_PREFIX: "quarantine"

      SPARK_MASTER: "local[*]"
      SPARK_SHUFFLE_PARTITIONS: "16"

    volumes:
      - ./logs:/opt/olist/logs