# Dùng chung MinIO của olist-lakehouse (container hostname: minio).
# Bật lakehouse trước: cd ../olist-lakehouse/infrastructure && docker compose up -d
services:
  olist-crawler:
    build: .
    container_name: olist-crawler
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATA_SOURCE_URL: ${DATA_SOURCE_URL:-http://host.docker.internal:8000}

      START_DATE: ${START_DATE:-2016-09-04}
      END_DATE: ${END_DATE:-2018-10-17}
      REVIEW_START_DATE: ${REVIEW_START_DATE:-2016-09-04}
      REVIEW_END_DATE: ${REVIEW_END_DATE:-2018-10-29}

      CRAWL_UNANSWERED_REVIEWS: ${CRAWL_UNANSWERED_REVIEWS:-true}

      RUN_TRANSACTIONS: ${RUN_TRANSACTIONS:-true}
      RUN_MASTER: ${RUN_MASTER:-true}
      BOOTSTRAP_MASTER: ${BOOTSTRAP_MASTER:-true}

      VERIFY_ORDER_COUNT: ${VERIFY_ORDER_COUNT:-true}
      MASTER_PAGE_SIZE: ${MASTER_PAGE_SIZE:-50000}

      MAX_RETRIES: ${MAX_RETRIES:-3}
      HTTP_TIMEOUT: ${HTTP_TIMEOUT:-120}
      RETRY_BACKOFF: ${RETRY_BACKOFF:-2}

      LANDING_PREFIX: ${LANDING_PREFIX:-bronze}
      RAW_DIR: ${RAW_DIR:-bronze/olist}
      STATE_FILE: ${STATE_FILE:-bronze/_metadata/crawler_state.json}
      MANIFEST_DIR: ${MANIFEST_DIR:-bronze/_metadata/manifests}

      # Credentials khớp olist-lakehouse/infrastructure/.env
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-admin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-handoff}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MINIO_CONNECT_RETRIES: ${MINIO_CONNECT_RETRIES:-30}
      MINIO_CONNECT_DELAY: ${MINIO_CONNECT_DELAY:-2}

    volumes:
      - ./raw:/app/raw
      - ./logs:/app/logs
    networks:
      - olist-network

networks:
  olist-network:
    name: olist-lakehouse-network
    external: true
