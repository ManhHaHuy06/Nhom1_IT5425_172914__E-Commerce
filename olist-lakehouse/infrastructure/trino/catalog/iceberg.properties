# =============================================================================
# Trino - Iceberg Catalog Configuration
# =============================================================================
# Cho phep Trino truy van truc tiep cac bang Bronze/Silver/Gold tren Iceberg.
# Cach dung:
#   SELECT * FROM iceberg.bronze.olist_orders;
#   SELECT * FROM iceberg.silver.fact_orders;
#   SELECT * FROM iceberg.gold.fact_order_summary;
# =============================================================================

connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://lakehouse/

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.path-style-access=true
s3.region=us-east-1
# = MINIO_ROOT_USER / MINIO_ROOT_PASSWORD from infrastructure/.env (passed to the container by docker compose)
s3.aws-access-key=${ENV:AWS_ACCESS_KEY_ID}
s3.aws-secret-key=${ENV:AWS_SECRET_ACCESS_KEY}

iceberg.max-partitions-per-writer=100
